name: Refresh sealed prices

on:
  schedule:
    - cron: "30 21 * * *"   # daily, after TCGCSV's evening refresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/build_sealed.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sealed.json
          git diff --cached --quiet || git commit -m "Refresh sealed prices"
          git pull --rebase
          git push
